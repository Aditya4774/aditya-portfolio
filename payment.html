<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Cinemas | Payment</title>
    <meta name="description" content="Securely pay for your movie tickets.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-wrapper">
        <header>
            <a href="index.html" class="logo">
                <span class="logo-icon">✨</span>
                <h1>Stellar Cinemas</h1>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="my-bookings.html" class="nav-link">Bookings</a>
                <a href="admin-login.html" class="nav-link">Admin</a>
            </nav>
        </header>
    </div>

    <div class="container">
        <h2 class="page-title">Checkout</h2>
        
        <div class="payment-wrapper">
            <!-- Order Summary -->
            <div class="summary-card">
                <h3>Order Summary</h3>
                <div class="summary-item">
                    <span>Movie</span>
                    <span id="summary-movie" style="font-weight: 600; text-align: right;">-</span>
                </div>
                <div class="summary-item">
                    <span>Tickets</span>
                    <span id="summary-tickets">-</span>
                </div>
                <div class="summary-item">
                    <span>Price per Ticket</span>
                    <span id="summary-price">-</span>
                </div>
                <div class="summary-total">
                    <span>Total Amount</span>
                    <span id="summary-total">₹0</span>
                </div>
                <button class="btn" style="margin-top: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);" onclick="window.location.href='seats.html'">Edit Seats</button>
            </div>

            <!-- Payment Form -->
            <div class="payment-card">
                <h3>Payment Details</h3>
                <form id="payment-form">
                    <div class="form-group">
                        <label for="name">Cardholder Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="card">Card Number</label>
                        <input type="text" id="card" class="form-control" placeholder="1234 5678 9101 1121" required pattern="[0-9 ]+">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="password" id="cvv" class="form-control" placeholder="123" required maxlength="4">
                        </div>
                    </div>
                    <button type="submit" class="btn" style="margin-top: 15px;">Pay Now</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="success-modal">
        <div class="modal-content">
            <div class="icon">🎟️</div>
            <h2>Booking Confirmed!</h2>
            <p>Your tickets have been successfully booked.</p>
            <button class="btn" onclick="window.location.href='index.html'">Back to Home</button>
        </div>
    </div>

    <script src="script-common.js"></script>
    <script src="script-payment.js"></script>
</body>
</html>
