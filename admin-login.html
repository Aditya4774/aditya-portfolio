<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Cinemas | Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-wrapper">
        <header>
            <a href="index.html" class="logo">
                <span class="logo-icon">✨</span>
                <h1>Stellar Cinemas</h1>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="my-bookings.html" class="nav-link">Bookings</a>
                <a href="admin-login.html" class="nav-link active">Admin</a>
            </nav>
        </header>
    </div>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
        <div class="payment-card" style="margin: 0; width: 100%; max-width: 400px;">
            <h3 style="text-align: center;">Admin Authentication</h3>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-password" style="text-align: center;">Enter Master Password</label>
                    <input type="password" id="admin-password" class="form-control" required style="text-align: center;">
                </div>
                <div id="login-error" style="color: var(--accent); text-align: center; margin-bottom: 15px; display: none;">Incorrect password. Access denied.</div>
                <button type="submit" class="btn" style="width: 100%;">Secure Login</button>
            </form>
        </div>
    </div>

    <script src="script-common.js"></script>
    <script src="script-admin-login.js"></script>
</body>
</html>
